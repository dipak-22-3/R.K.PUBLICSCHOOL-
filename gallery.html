<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | RKPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-hero { padding: 80px 20px; background: var(--navy-blue); color: var(--white); text-align: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 40px 5%; }
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; cursor: pointer; aspect-ratio: 4/3; border: 3px solid var(--gold-light); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .gallery-item:hover img { transform: scale(1.1); filter: brightness(0.7); }
    </style>
</head>
<body>

    <header class="navbar" id="navbar">
        <a href="index.html" class="logo"><i class="fas fa-book-reader gold-icon"></i><span>RKPS</span></a>
        <nav class="desktop-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="btn-portal">Portal Login</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </header>

    <section class="page-hero">
        <h1 class="serif-font gold-text">Campus Life</h1>
        <p>A glimpse into our world-class infrastructure.</p>
    </section>

    <section class="gallery-grid">
        <div class="gallery-item"><img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=800" alt="Building"></div>
        <div class="gallery-item"><img src="https://images.unsplash.com/photo-1588072432836-e10032774350?q=80&w=800" alt="Lab"></div>
        <div class="gallery-item"><img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=800" alt="Class"></div>
        <div class="gallery-item"><img src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=800" alt="Sports"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
