<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | RKPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-hero { padding: 80px 20px; background: var(--navy-blue); color: var(--white); text-align: center; }
        .contact-container { display: flex; padding: 60px 5%; gap: 50px; flex-wrap: wrap; }
        .contact-info, .contact-form { flex: 1; min-width: 300px; background: var(--white); padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .info-item { display: flex; align-items: center; margin-bottom: 25px; }
        .info-item i { font-size: 24px; color: var(--gold); margin-right: 15px; }
        .form-group { position: relative; margin-bottom: 30px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 0; border: none; border-bottom: 2px solid #ddd; outline: none; background: transparent; font-size: 1rem; color: var(--navy-blue); }
        .form-group label { position: absolute; top: 10px; left: 0; color: #888; pointer-events: none; transition: 0.3s; }
        .form-group input:focus ~ label, .form-group input:valid ~ label, .form-group textarea:focus ~ label, .form-group textarea:valid ~ label { top: -20px; font-size: 0.85rem; color: var(--gold); font-weight: 600; }
        .form-group input:focus, .form-group textarea:focus { border-bottom-color: var(--navy-blue); }
    </style>
</head>
<body>

    <header class="navbar" id="navbar">
        <a href="index.html" class="logo"><i class="fas fa-book-reader gold-icon"></i><span>RKPS</span></a>
        <nav class="desktop-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="login.html" class="btn-portal">Portal Login</a></li>
            </ul>
        </nav>
        <div class="nav-actions">
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </header>

    <section class="page-hero">
        <h1 class="serif-font gold-text">Get in Touch</h1>
        <p>We are here to help you.</p>
    </section>

    <section class="contact-container">
        <div class="contact-info">
            <h2 class="serif-font" style="color:var(--navy-blue); margin-bottom: 20px;">School Office</h2>
            <div class="info-item"><i class="fas fa-map-marker-alt"></i><p>RK Public School, Parasia</p></div>
            <div class="info-item"><i class="fas fa-phone-alt"></i><p>+91 98765 43210</p></div>
            <div class="info-item"><i class="fas fa-envelope"></i><p>admissions@rkps.edu.in</p></div>
        </div>

        <div class="contact-form">
            <h2 class="serif-font" style="color:var(--navy-blue); margin-bottom: 20px;">Admission Enquiry</h2>
            <form>
                <div class="form-group">
                    <input type="text" required>
                    <label>Parent's Name</label>
                </div>
                <div class="form-group">
                    <input type="tel" required>
                    <label>Phone Number</label>
                </div>
                <div class="form-group">
                    <textarea rows="3" required></textarea>
                    <label>Message</label>
                </div>
                <button type="submit" class="btn-portal" style="width: 100%; background: var(--navy-blue); color: var(--white); cursor: pointer; border: none; padding: 15px;">Send Message</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
